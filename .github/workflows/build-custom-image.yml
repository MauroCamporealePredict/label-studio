# Builds our fork into a Docker image and publishes it to this repository's GitHub
# Container Registry, so it can be pulled straight onto the server.
#
# Runs only when started by hand: building is a deliberate act, and a push should not
# quietly produce a new image you might deploy without meaning to.
name: Build custom image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the image, e.g. 1.0.0"
        required: true
      platform:
        description: "Architecture of the server this image will run on"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch this workflow was started from
        uses: actions/checkout@v4

      - name: Work out the image name
        id: image
        # the registry rejects uppercase, and the owner name has some
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Collect the commit details shown on the version page
        id: commit
        run: |
          {
            echo "message=$(git log -1 --pretty=%s)"
            echo "date=$(git log -1 --pretty=%cI)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platform }}
          push: true
          # the commit tag is the one to fall back to: version tags can be reused by
          # mistake, a commit tag always points at exactly this build
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            COMMIT_BRANCH=${{ github.ref_name }}
            COMMIT_MESSAGE=${{ steps.commit.outputs.message }}
            COMMIT_DATE=${{ steps.commit.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say how to pull it
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.image.outputs.name }}:${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
